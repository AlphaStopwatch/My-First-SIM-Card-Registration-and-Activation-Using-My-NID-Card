<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>ALPHA — Infinite Day Counter</title>
  <meta name="description" content="One moment. Endless days.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="title">ALPHA</h1>
    <p class="subtitle">INFINITE DAY COUNTER</p>

    <div class="counter" role="timer" aria-live="off">
      <div class="number" id="days" aria-label="Elapsed days">0</div>
      <div class="unit">DAYS</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
